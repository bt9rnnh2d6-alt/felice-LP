<body>

<header class="sim-header">
  <div class="sim-logo serif-en">Felice<span>Clay Cake Studio</span></div>
  <a href="index.html" class="sim-back serif-en">&larr; サイトに戻る</a>
</header>

<div class="sim-intro">
  <span class="eyebrow serif-en">Order Simulator</span>
  <h1>世界に一つだけのケーキを、つくる。</h1>
  <p>段数・サイズと、実物の3D部品（苺・お花・マカロン・トッパーなど）を組み合わせて、360°プレビュー。保存した画像を添えて、そのままご相談いただけます。</p>
</div>

<main class="sim-main">
  <div class="stage-wrap">
    <canvas id="cakeCanvas"></canvas>
    <div class="stage-hint">ドラッグで回転 ・ スクロール／ピンチで拡大</div>
    <div class="stage-loading" id="stageLoading">Loading…</div>
  </div>

  <!-- コントロールはマニフェスト(assets/models/manifest.json)から動的生成 -->
  <div class="panel" id="panel"></div>
</main>

<noscript>
  <div class="nojs">3Dシミュレーターのご利用には JavaScript を有効にしてください。<br>
